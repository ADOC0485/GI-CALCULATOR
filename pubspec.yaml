name: genshin_progress_planner
description: Planificador local de progresión para Genshin Impact.
publish_to: none
version: 0.3.1+6
environment:
  sdk: '>=3.13.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  drift: 2.35.4
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  intl: 0.20.3
  timezone: 0.11.2
  archive: 4.3.0
  url_launcher: 6.3.3
  shorebird_code_push: 2.0.7
  cryptography: ^2.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: 2.35.3
  build_runner: 2.17.1
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog/seed-v1.json
    - assets/catalog/LICENSE-genshin-db.txt
    - assets/catalog/nombres-es.json
    - assets/branding/logo.png
    - assets/rules/progression-v1.json
    - assets/rules/LICENSE-paimon-moe.txt
    - shorebird.yaml
